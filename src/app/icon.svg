<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <title>TeyitRandevu</title>
  <!--
    Sekme ikonu, `components/marketing/ui.tsx` içindeki Wordmark ile aynı işaret:
    teyit = onay, o yüzden bir tik. Degrade leke ya da soyut şekil yok.

    Marka yeşili sabit; tik beyaz. Sekme çubuğu açık da olsa koyu da olsa dolu
    bir kare üzerinde beyaz tik okunur — tema duyarlı bir favicon her tarayıcıda
    çalışmıyor ve 16 pikselde kazancı yok.
  -->
  <rect width="20" height="20" rx="4.5" fill="#0A6B4F" />
  <path
    d="M5.6 10.3 8.5 13.2 14.4 7"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
